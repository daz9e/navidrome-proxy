[project]
name = "navidrome-proxy"
version = "2.0.0"
description = "Subsonic/OpenSubsonic proxy in front of Navidrome that adds an external catalog and downloads what you play or like"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.10",
    "mutagen>=1.47",
    "yt-dlp[default]>=2026.9",
    "ytmusicapi>=1.10",
]

[project.scripts]
navidrome-proxy = "navidrome_proxy.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navidrome_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs docker (real Navidrome container)",
    "network: talks to real external services (Deezer, YouTube, SoundCloud)",
]
addopts = "-m 'not integration and not network'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "ASYNC109", "RUF005", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "E501", "ASYNC221"]
